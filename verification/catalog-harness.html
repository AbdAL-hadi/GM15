<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><link rel="icon" href="/favicon.svg"><title>Catalog test fixture</title><div id="root"></div>
<script type="module">
import React from 'react'
import { createRoot } from 'react-dom/client'
import { CatalogProvider, useCatalog } from '/src/state/Catalog.tsx'
import { demoCatalogSource } from '/src/data/catalog.ts'
const mode = new URLSearchParams(location.search).get('mode')
let calls = 0
const source = { async load(signal) {
  calls++
  await new Promise(resolve => setTimeout(resolve, 200))
  signal.throwIfAborted()
  if(mode === 'retry' && calls === 1) throw Error('simulated failure')
  if(mode === 'empty' && calls === 1) return {products:[],layerings:[]}
  return demoCatalogSource.load(signal)
}}
function Loaded() { const {products} = useCatalog(); return React.createElement('h1',null,`loaded ${products.length}`) }
createRoot(document.getElementById('root')).render(React.createElement(CatalogProvider,{source},React.createElement(Loaded)))
</script></html>
